<!DOCTYPE html>
<html>
<head>
    <title>Task Tracker</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <h1>To-Do List</h1>

    <form id="taskForm">
        <label for="taskInput">Enter your task:</label>
        <input type="text" id="taskInput" name="task">
        <button type="submit" id="addButton" class="button button-add">Add</button>
    </form>

    <div class="container-tasks">
        <div class="header">
            <h3>Uncompleted</h3>
            <a href="./pages/about.html">Completed</a>  <!-- anchor tag -->
        </div>
        <ul id="uncompletedTasks">  <!-- unordered list -->
            <!-- li = one item inside the list -->
            <!-- here, the items are created dynamically with JS -->
        </ul>
        <div id="emptyStateMessage">
            <p>There are no uncompleted Tasks.</p>
            <p>Well done!</p>
        </div>
    </div>

    <div id="emptyTaskMessage">
        <p>Please enter a task description!.</p>
    </div>

    <!-- modules support import/export, classic scripts don't -->
    <script type="module" src="script.js"></script>
</body>
</html>
