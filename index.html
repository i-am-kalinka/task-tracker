<!DOCTYPE html>
<html>
<head>
    <title>Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>To-Do List</h1>
    <form id="taskForm">
        <label for="taskInput">Enter your task:</label>
        <input type="text" id="taskInput" name="task">
        <button type="submit" id="addButton">Add</button>
    </form>

    <p id="message"></p>

    <div id="messageLog">
        <!-- anchor tag -->
        <a href="./pages/about.html">Completed Tasks</a>
    </div>

    <div>
        <h3>Uncompleted</h3>
        <link rel="stylesheet" href="style.css">
        <!-- ul is the container for an unordered list -->
        <ul id="uncompletedTasks">
            <!-- li is one item inside the list -->
            <!-- here, the items are created dynamically with JS -->
        </ul>
    </div>

    <!-- modules support import/export, classic scripts don't -->
    <script type="module" src="script.js"></script>
</body>
</html>
